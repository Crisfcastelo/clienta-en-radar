<!doctype html>
<html lang="es">
  <body
    style="margin: 0; padding: 24px; background: #f5f0e8; font-family: Arial, Helvetica, sans-serif; color: #2a2622"
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="max-width: 480px; margin: 0 auto; background: #ffffff; border-radius: 16px"
    >
      <tr>
        <td style="padding: 32px 28px">
          <p style="margin: 0 0 4px; font-size: 14px; color: #6b625a">Clienta en Radar · Crisfcastelo</p>
          <h1 style="margin: 0 0 16px; font-size: 22px; font-weight: normal">Tu código para entrar</h1>
          <p style="margin: 0 0 20px; font-size: 16px; line-height: 1.5">
            Escribe este código en la app. Caduca en 10 minutos.
          </p>
          <p style="margin: 0 0 24px; font-size: 34px; letter-spacing: 8px; font-weight: bold; color: #24483a">
            {{ .Token }}
          </p>
          <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #6b625a">
            Si no has pedido este código, puedes ignorar este email. Nadie podrá entrar sin él.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
